<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Callback</title>
    <script>
        // synchronous programming
        let a = prompt("What is your name?");
        let b = prompt("What is your age?");
        let c = prompt("What is your favorite color?");
        console.log(a + " is " + b + " years old and has " + c + " favorite color.");

        // asynchronous programming
        console.log("start");
        setTimeout(function () {
            console.log("Hey I am good");
        }, 3000);
        console.log("end");



        // *** Callbacks
        // A callback is a function that is passed as an argument to another function and is executed after some operation has been completed. It allows you to handle asynchronous operations and ensures that certain code runs only after a specific task is finished.
        // Example of a callback function
        function loadScript(src, callback) {
            var script = document.createElement("script");
            script.src = src;
            document.body.appendChild(script);
        }

        // Using the loadScript function with a callback
        loadScript(
            "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js",
            function () {
                console.log("Script loaded successfully.");
            },
        );






    </script>
</head>

<body></body>

</html>
