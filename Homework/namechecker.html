<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <label for="full_name">Full Name : </label>
        <input type="text" id="full_name" placeholder="Enter Your Full_Name">
        <button onclick="separate()">separate</button>
        <br><br>
        first : <p id="first"></p> <br>
        middle : <p id="middle"></p><br>
        last : <p id="last"></p><br>

    </div>
</body>
<script>
    function separate() {
        let name = document.getElementById("full_name").value;
        store = name.trim().split(" ");

        if (store.length == 2) {
            document.getElementById("first").innerText = store[0];
            document.getElementById("middle").innerText = "";
            document.getElementById("last").innerText = store[1];
        }
        else {
            document.getElementById("first").innerHTML = store[0];
            document.getElementById("middle").innerHTML = store[1];
            document.getElementById("last").innerHTML = store[2];


            // }
        }
</script>

</html>
