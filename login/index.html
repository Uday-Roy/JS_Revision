<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function validateForm() {
            var username = document.getElementById("txtUid").value;
            var password = document.getElementById("txtPwd").value;

            if (username === "" || password === "") {
                alert("Please fill in both fields.");
                return false;
            }
            var xhr = new XMLHttpRequest();
            xhr.onreadystatechange = function () {
                //if (xhr.readyState == 4 && xhr.status == 200)
                document.getElementById("spnDisp").innerHTML = xhr.responseText;
            };

            var qs = "login.php?txtUid=" + encodeURIComponent(username) + "&txtPwd=" + password;
            alert(qs);
            xhr.open("GET", qs, true);
            xhr.send();
            return true;
        }
    </script>

</head>

<body>
    <h2>Login</h2>

    <label for="username">Username:</label>
    <input type="text" id="txtUid" name="txtUid">
    <br>
    <label for="password">Password:</label>
    <input type="password" id="txtPwd" name="txtPwd">
    <br>
    <button type="button" onclick="validateForm()">Login</button>
    <p>
        <span id="spnDisp"></span>
    </p>

</body>

</html>
