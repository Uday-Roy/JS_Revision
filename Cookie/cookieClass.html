<!-- *** New one optimized code for cookie class *** -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Demo</title>
    <script>
        function checkCookie() {
            var cdata = document.cookie;
            // Create expiry date
            var dt = new Date();
            dt.setTime(dt.getTime() + (7 * 24 * 60 * 60 * 1000));
            var exp = "expires=" + dt.toUTCString();
            // Check if username cookie exists
            if (cdata.length == 0) {
                alert("First Visit");
                // Create username cookie   
                document.cookie = "username=admin;" +
                    exp +
                    ";path=/";
            }
            else {
                var eqpos = cdata.indexOf("=");
                if (eqpos == -1) {
                    alert("Invalid cookie format");
                }
                else {
                    var uname = cdata.substring(eqpos + 1);
                    alert("Welcome Back, " + uname);
                    //alert(document.cookie);
                }
            }
        }
    </script>
</head>

<body onload="checkCookie()" style="background-color: black; color: white; text-align: center;">
    <h1 style="text-align:center;">
        Cookie Demo
    </h1>
</body>

</html>
